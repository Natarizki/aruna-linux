# Aruna Sway visual defaults
# Loaded by Fedora's layered Sway configuration.

# Window borders
default_border pixel 2
default_floating_border pixel 2

# Gaps
gaps inner 6
gaps outer 2
smart_gaps on

# Aruna blue palette
client.focused          #2563EB #1E40AF #FFFFFF #60A5FA #2563EB
client.focused_inactive  #334155 #1E293B #E2E8F0 #475569 #1E293B
client.unfocused         #1E293B #0F172A #CBD5E1 #334155 #0F172A
client.urgent            #DC2626 #991B1B #FFFFFF #F87171 #991B1B
client.placeholder       #1E293B #0F172A #CBD5E1 #334155 #0F172A
client.background        #0B1220
