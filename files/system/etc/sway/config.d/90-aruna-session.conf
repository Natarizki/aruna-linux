# Aruna session defaults
# Start the system wallpaper for the current Sway session.
exec_always swaybg -i /usr/share/backgrounds/aruna/aruna-blue.svg -m fill

# Lock the session with the Aruna blue lock-screen palette.
bindsym $mod+Shift+x exec swaylock \
  --color 0b1220 \
  --inside-color 1e293b \
  --inside-clear-color 1e293b \
  --inside-ver-color 1e40af \
  --ring-color 2563eb \
  --ring-clear-color 60a5fa \
  --ring-ver-color 60a5fa \
  --key-hl-color 93c5fd \
  --bs-hl-color f87171 \
  --line-color 0b1220 \
  --separator-color 1e40af \
  --text-color e2e8f0 \
  --font "Inter" \
  --clock \
  --timestr "%H:%M" \
  --datestr "%A, %d %B" \
  --indicator-radius 100 \
  --indicator-thickness 8
