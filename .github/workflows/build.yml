name: Aruna Linux image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build Aruna Linux
    runs-on: ubuntu-latest
    steps:
      - name: Build and publish image
        uses: blue-build/github-action@v1.13
        with:
          recipe: recipes/recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
