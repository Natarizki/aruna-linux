name: Aruna Linux installer ISO

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-iso:
    name: Generate, audit and QEMU-test Aruna installer ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools qemu-system-x86 ovmf
          bash <(curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh)
          bluebuild --version
          xorriso -version
          qemu-system-x86_64 --version

      - name: Generate installer ISO
        run: |
          sudo bluebuild generate-iso \
            --variant kinoite \
            --iso-name aruna-linux-x86_64.iso \
            --output-dir output \
            image ghcr.io/natarizki/aruna-linux:latest

      - name: Verify ISO output
        run: |
          test -s output/aruna-linux-x86_64.iso
          file output/aruna-linux-x86_64.iso
          sha256sum output/aruna-linux-x86_64.iso

      - name: Audit ISO EFI boot entries
        run: |
          bash scripts/inspect-iso-ia32.sh output/aruna-linux-x86_64.iso ia32-audit

      - name: QEMU x86_64 UEFI smoke test
        run: |
          bash scripts/qemu-iso-smoke.sh output/aruna-linux-x86_64.iso qemu-smoke

      - name: Upload installer ISO
        uses: actions/upload-artifact@v4
        with:
          name: aruna-linux-x86_64-installer-iso
          path: output/aruna-linux-x86_64.iso
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload IA32 audit report
        uses: actions/upload-artifact@v4
        with:
          name: aruna-iso-ia32-audit
          path: ia32-audit/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload QEMU test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aruna-qemu-x86_64-uefi-smoke
          path: qemu-smoke/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
