name: Inspect Sericea login stack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect base image login components
    runs-on: ubuntu-latest
    steps:
      - name: Pull Sericea base image
        run: docker pull ghcr.io/ublue-os/sericea-main:latest

      - name: Report display-manager packages and systemd defaults
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/bash ghcr.io/ublue-os/sericea-main:latest -lc '
            echo "=== Login-related packages ==="
            rpm -qa | sort | grep -Ei "^(gdm|sddm|greetd|tuigreet|regreet|gtkgreet|ly)(-|$)" || true

            echo
            echo "=== Display manager alias ==="
            if [ -L /etc/systemd/system/display-manager.service ]; then
              readlink -f /etc/systemd/system/display-manager.service
            elif [ -e /etc/systemd/system/display-manager.service ]; then
              ls -l /etc/systemd/system/display-manager.service
            else
              echo "No /etc display-manager.service symlink"
            fi

            echo
            echo "=== Enabled login-related units ==="
            find /etc/systemd/system /usr/lib/systemd/system \
              -maxdepth 3 \( -name "gdm.service" -o -name "sddm.service" -o -name "greetd.service" -o -name "display-manager.service" \) \
              -print 2>/dev/null | sort
          '
