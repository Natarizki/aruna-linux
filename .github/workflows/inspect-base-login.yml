name: Inspect Fedora Sway Atomic login stack

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-base-login.yml'
      - 'recipes/recipe.yml'
      - 'files/system/usr/share/sddm/themes/aruna/**'
      - 'files/system/etc/sddm.conf.d/10-aruna-theme.conf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Fedora Sway Atomic 45
    runs-on: ubuntu-latest
    steps:
      - name: Check out Aruna repository
        uses: actions/checkout@v4

      - name: Pull Fedora Sway Atomic base image
        run: docker pull quay.io/fedora-ostree-desktops/sway-atomic:45

      - name: Inspect base SDDM runtime and validate Aruna theme integration
        shell: bash
        run: |
          set -euo pipefail

          test -s files/system/usr/share/sddm/themes/aruna/Main.qml
          test -s files/system/usr/share/sddm/themes/aruna/metadata.desktop
          test -s files/system/etc/sddm.conf.d/10-aruna-theme.conf
          grep -q '^Name=Aruna$' files/system/usr/share/sddm/themes/aruna/metadata.desktop
          grep -q '^Current=aruna$' files/system/etc/sddm.conf.d/10-aruna-theme.conf
          grep -q 'import SddmComponents 2.0' files/system/usr/share/sddm/themes/aruna/Main.qml
          grep -q 'sddm.login(name.text, password.text, sessionIndex)' files/system/usr/share/sddm/themes/aruna/Main.qml

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            --entrypoint /bin/bash \
            quay.io/fedora-ostree-desktops/sway-atomic:45 -lc '
              set -e
              echo "=== Required SDDM and Qt runtime ==="
              rpm -q sddm qt6-qtbase qt6-qtdeclarative qt6-qtsvg
              echo
              echo "=== Base display manager ==="
              readlink -f /etc/systemd/system/display-manager.service
              echo
              echo "=== Aruna theme metadata ==="
              cat /workspace/files/system/usr/share/sddm/themes/aruna/metadata.desktop
              echo
              echo "=== Aruna SDDM configuration ==="
              cat /workspace/files/system/etc/sddm.conf.d/10-aruna-theme.conf
              echo
              echo "=== Aruna QML integration checks ==="
              grep -nE "^(import |[[:space:]]*(TextBox|PasswordBox|ComboBox|Button) \{|[[:space:]]*onClicked:)" /workspace/files/system/usr/share/sddm/themes/aruna/Main.qml
              echo
              echo "Theme files and base runtime checks passed."
            '
