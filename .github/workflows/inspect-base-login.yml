name: Inspect Fedora Sway Atomic login stack

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-base-login.yml'
      - 'recipes/recipe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Fedora Sway Atomic 45
    runs-on: ubuntu-latest
    steps:
      - name: Pull Fedora Sway Atomic base image
        run: docker pull quay.io/fedora-ostree-desktops/sway-atomic:45

      - name: Inspect display manager, SDDM theme source, and Qt runtime
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/bash quay.io/fedora-ostree-desktops/sway-atomic:45 -lc '
            echo "=== Login and Qt/QML packages ==="
            rpm -qa | sort | grep -Ei "^(sddm|qt6-qt(declarative|quick|wayland|base|svg|shadertools)|qt6-qml|kf6-.*)(-|$)" || true

            echo
            echo "=== Display manager ==="
            readlink -f /etc/systemd/system/display-manager.service || true
            systemctl --root=/ --no-pager is-enabled sddm.service 2>/dev/null || true

            echo
            echo "=== SDDM theme metadata ==="
            cat /usr/share/sddm/themes/03-sway-fedora/metadata.desktop

            echo
            echo "=== SDDM theme Main.qml (first 260 lines) ==="
            sed -n "1,260p" /usr/share/sddm/themes/03-sway-fedora/Main.qml

            echo
            echo "=== SDDM theme assets ==="
            find /usr/share/sddm/themes/03-sway-fedora -maxdepth 2 -type f | sort
          '
