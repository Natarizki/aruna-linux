---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: aruna-linux
description: Aruna Linux is an independent immutable desktop image based on Fedora Sericea and Sway.

# Universal Blue's Sericea image provides the Sway desktop and Fedora Atomic base.
base-image: ghcr.io/ublue-os/sericea-main
image-version: latest

# Apply Aruna's system-wide Sway configuration.
modules:
  - from-file: desktop-packages.yml

  - type: files
    files:
      - source: system
        destination: /

  - type: signing
