---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: aruna-linux
description: Aruna Linux is an independent immutable desktop image based on Fedora Sway Atomic.

# Fedora renamed Sericea to Sway Atomic and moved the container image to Quay.
base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: "45"

# Apply Aruna's system-wide Sway configuration.
modules:
  - from-file: desktop-packages.yml

  - type: files
    files:
      - source: system
        destination: /

  - type: signing
